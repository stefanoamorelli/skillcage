[project]
name = "skillcage"
version = "0.1.0"
description = "Detonate an untrusted AI agent skill in a rootless sandbox and see what it actually touches"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Stefano Amorelli", email = "stefano@amorelli.tech" }]
keywords = ["ai", "agent", "skills", "mcp", "security", "sandbox"]
dependencies = ["pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/stefanoamorelli/skillcage"

[project.scripts]
skillcage = "skillcage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skillcage"]

[tool.hatch.build.targets.wheel.force-include]
"skillcage/assets" = "skillcage/assets"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
